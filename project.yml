name: Ethnym

options:
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  # The git-ignored App/Secrets.plist starts as a copy of the committed example. See README.
  preGenCommand: "[ -f App/Secrets.plist ] || cp App/Secrets.example.plist App/Secrets.plist"

settings:
  base:
    # Single source of truth for IDs. Matches the Android app's applicationId.
    APP_BUNDLE_ID: com.ethnym
    # Pyhash LLC, the paid team. The free personal team can't use TestFlight or App Groups.
    DEVELOPMENT_TEAM: 8G6DC3A5B8
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.1"
    CURRENT_PROJECT_VERSION: "6"

packages:
  EthnymKit:
    path: Packages/EthnymKit
  BigInt:
    url: https://github.com/attaswift/BigInt
    from: 5.7.0

targets:
  Ethnym:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: [Secrets.example.plist]
    dependencies:
      - package: EthnymKit
      - package: BigInt
    settings:
      base:
        PRODUCT_NAME: Ethnym
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # UI code runs on the main actor unless it opts out.
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: ETHnym
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSCameraUsageDescription: ETHnym uses the camera to scan addresses from QR codes.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
    scheme:
      testTargets: [EthnymUITests]

  EthnymUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Ethnym
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).uitests
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Ethnym
